---
# Tests files, packages and users on Rocky Linux 9 and 10; no systemd is needed. As in
# pgvillage, chainsmith runs on the first host in localhosts (legacy defaults), with a
# chainsmith release binary downloaded in prepare.yml, and the certificates are
# deployed to the containers.
dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_SCENARIO_DIRECTORY}/requirements.yml
driver:
  name: podman
platforms:
  - name: chainsmith-el9
    image: docker.io/geerlingguy/docker-rockylinux9-ansible:latest
    pre_build_image: true
    command: sleep infinity
    groups:
      - hacluster
  - name: chainsmith-el10
    image: docker.io/geerlingguy/docker-rockylinux10-ansible:latest
    pre_build_image: true
    command: sleep infinity
    groups:
      - hacluster
provisioner:
  name: ansible
  config_options:
    defaults:
      # The role's defaults use {% do %}, as does pgvillage's ansible.cfg
      jinja2_extensions: jinja2.ext.do
  inventory:
    hosts:
      localhosts:
        hosts:
          chainsmith-manager:
            ansible_connection: local
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
    group_vars:
      all:
        chainsmith_users:
          hacluster:
            - postgres
        chainsmith_package_names: []
        chainsmith_cmd: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/chainsmith"
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
