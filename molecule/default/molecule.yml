---
# Tests the role on Rocky Linux 9 and 10 in systemd containers. As in
# pgvillage, chainsmith runs on the Ansible controller (localhost), with a
# chainsmith release binary downloaded in prepare.yml, and the certificates are
# deployed to the containers.
dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_SCENARIO_DIRECTORY}/requirements.yml
driver:
  name: podman
platforms:
  - name: chainsmith-el9
    image: docker.io/geerlingguy/docker-rockylinux9-ansible:latest
    pre_build_image: true
    command: /usr/sbin/init
    systemd: always
    groups:
      - hacluster
  - name: chainsmith-el10
    image: docker.io/geerlingguy/docker-rockylinux10-ansible:latest
    pre_build_image: true
    command: /usr/sbin/init
    systemd: always
    privileged: true
    groups:
      - hacluster
provisioner:
  name: ansible
  config_options:
    defaults:
      # The role's defaults use {% do %}, as does pgvillage's ansible.cfg
      jinja2_extensions: jinja2.ext.do
  inventory:
    group_vars:
      all:
        chainsmith_nodes: "{{ groups['hacluster'] }}"
        chainsmith_users:
          hacluster:
            - postgres
        chainsmith_package_names: []
        chainsmith_cmd: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/chainsmith"
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
