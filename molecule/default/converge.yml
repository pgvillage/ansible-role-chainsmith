---
# The controller and recipients must run the role together.
- name: Converge
  hosts: >-
    {{ (groups.get('chainsmith_controller', groups.get('localhosts', []))[:1]
        + groups.get('chainsmith_nodes', groups.get('hacluster', []) + groups.get('backup', []))) | unique | list }}
  roles:
    - role: pgvillage.chainsmith
