---
# Regression: a controller whose inventory name is not localhost also receives
# certificates. Both nodes use the shared cryptographic and cleanup checks.
dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_SCENARIO_DIRECTORY}/../default/requirements.yml
driver:
  name: podman
platforms:
  - name: chainsmith-controller-node
    image: docker.io/geerlingguy/docker-rockylinux9-ansible:latest
    pre_build_image: true
    command: /usr/sbin/init
    systemd: always
    groups:
      - chainsmith_controller
      - chainsmith_nodes
      - hacluster
  - name: chainsmith-recipient
    image: docker.io/geerlingguy/docker-rockylinux10-ansible:latest
    pre_build_image: true
    command: /usr/sbin/init
    systemd: always
    privileged: true
    groups:
      - chainsmith_nodes
      - hacluster
provisioner:
  name: ansible
  playbooks:
    prepare: ../default/prepare.yml
    converge: ../default/converge.yml
    verify: ../default/verify.yml
    side_effect: ../default/side_effect.yml
  config_options:
    defaults:
      jinja2_extensions: jinja2.ext.do
  inventory:
    group_vars:
      all:
        chainsmith_users:
          hacluster:
            - postgres
        chainsmith_package_names: []
        chainsmith_cmd: /tmp/chainsmith
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
