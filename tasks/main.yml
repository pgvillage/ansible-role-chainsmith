---
# tasks file for chainsmith

# An empty chainsmith_controller or chainsmith_nodes group leaves the selection empty
- name: Validate the chainsmith controller and recipients
  ansible.builtin.assert:
    that:
      - groups.chainsmith_controller | default([]) | length < 2
      - chainsmith_controller_host | length > 0
      - chainsmith_nodes | length > 0
    fail_msg: >-
      Select exactly one controller (chainsmith_controller, or else the first host in localhosts)
      and at least one recipient (chainsmith_nodes, or else hacluster + backup).
      The controller may also be a recipient.
    quiet: true

- name: Explain why chainsmith is skipped for this batch
  ansible.builtin.debug:
    msg: >-
      WARNING: Chainsmith skipped for this batch. Controller: {{ chainsmith_controller_host }}.
      Required hosts outside this batch: {{ _chainsmith_missing_hosts | join(', ') }}.
      Package installation, certificate checks, generation and deployment were skipped.
      Run Chainsmith with the controller and all recipients together in one batch.
  when: _chainsmith_missing_hosts | length > 0
  run_once: true

- name: Manage certificates for the complete batch
  ansible.builtin.include_tasks: manage.yml
  when: _chainsmith_missing_hosts | length == 0
