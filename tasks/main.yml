---
# tasks file for chainsmith

- name: Validate chainsmith inventory groups
  ansible.builtin.assert:
    that:
      - "'chainsmith_controller' not in groups or groups['chainsmith_controller'] | length == 1"
      - "'chainsmith_nodes' not in groups or groups['chainsmith_nodes'] | length > 0"
    fail_msg: >-
      When defined, chainsmith_controller must contain exactly one host and
      chainsmith_nodes must contain at least one recipient. The controller may also be a recipient.
    quiet: true

- name: Validate chainsmith host selection
  ansible.builtin.assert:
    that:
      - chainsmith_controller_host | length > 0
      - chainsmith_nodes | length > 0
    fail_msg: >-
      Select a controller through chainsmith_controller or the first host in localhosts,
      and recipients through chainsmith_nodes or hacluster + backup.
      The chainsmith_controller_host and chainsmith_nodes variables may also be overridden.
    quiet: true

- name: Explain why chainsmith is skipped for this batch
  ansible.builtin.debug:
    msg: >-
      WARNING: Chainsmith skipped for this batch. Controller: {{ chainsmith_controller_host }}.
      Required hosts outside this batch: {{ _chainsmith_missing_hosts | join(', ') }}.
      Package installation, certificate checks, generation and deployment were skipped.
      Run Chainsmith with the controller and all recipients together in one batch.
  when: _chainsmith_missing_hosts | length > 0
  run_once: true

- name: Manage certificates for the complete batch
  ansible.builtin.include_tasks: manage.yml
  when: _chainsmith_missing_hosts | length == 0
