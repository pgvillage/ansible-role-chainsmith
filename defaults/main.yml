---
# defaults file for chainsmith

# State of the chainsmith package(s) (present, latest, absent).
# Installation only runs on localhost, where the chain is generated.
chainsmith_package_state: present
# List of packages to install to provide the chainsmith binary.
chainsmith_package_names:
  - chainsmith

# Path to the chainsmith executable on localhost.
chainsmith_cmd: "/usr/local/bin/chainsmith"

# Path on each target node where the list of deployed certificate files is written.
# This list is used to check if certificates are missing or about to expire.
chainsmith_cert_list: /tmp/chainsmith_cert_list.txt
# Certificates expiring within this number of days are considered invalid,
# which triggers regeneration and redeployment of the full chain.
chainsmith_expiry_days: 30

# Subject used for the root CA and intermediates generated by chainsmith.
# Keys are X.509 subject attributes (C, ST, L, O, OU, CN).
chainsmith_subject:
  C: NL/postalCode=2403 VP
  ST: Zuid Holland
  L: Alphen aan den Rijn/street=Weegbreestraat 7
  O: Mannem Solutions
  OU: PgVillage
  CN: postgres

# Directory (on localhost) where chainsmith writes its output.
# Defaults to a temporary directory created by the role.
chainsmith_tmpdir: "{{ chainsmith_tmpfile.path }}"
# chainsmith_tmpdir: /tmp/certs/postgres

# Definition of the intermediate CA that issues the server certificates.
# `servers` is a dict of server name -> list of SAN entries (hostnames / IPs).
chainsmith_server_intermediate:
  name: server
  keyUsages:
    - keyEncipherment
    - dataEncipherment
    - digitalSignature
  extendedKeyUsages:
    - serverAuth
  servers: "{{ chainsmith_servers }}"

# Inventory hosts that receive certificates (and are checked for expiry).
chainsmith_nodes: "{{ groups['hacluster'] + groups['backup'] }}"
# List of FQDNs of all chainsmith_nodes (derived from facts).
chainsmith_hosts: "{% set nodes = [] %}{% for node in chainsmith_nodes %}{% do nodes.append(hostvars[node].ansible_facts.fqdn) %}{% endfor %}{{ nodes }}"
# List of the first IPv4 address of all chainsmith_nodes (derived from facts).
chainsmith_ips: |
  {% set nodes = [] %}
  {% for node in chainsmith_nodes %}
  {% do nodes.append(hostvars[node].ansible_facts.all_ipv4_addresses[0]) %}
  {% endfor %}
  {{ nodes }}
# Dict of server certificates to generate: FQDN -> list of SAN entries.
# By default every server cert is valid for all hosts and IPs,
# which is a requirement for stolon_proxy.
chainsmith_servers: |
  {% set nodes = {} %}
  {% for node in chainsmith_nodes %}
  {% do nodes.update({hostvars[node].ansible_facts.fqdn: chainsmith_hosts + chainsmith_ips}) %}
  {% endfor %}
  {{ nodes }}
# For server certs which correspond to one host only, use the following:
# chainsmith_servers: |
#   {% set nodes = {} %}
#   {% for node in chainsmith_nodes %}
#   {% do nodes.update({hostvars[node].ansible_facts.fqdn: hostvars[node].ansible_facts.all_ipv4_addresses }) %}
#   {% endfor %}
#   {{ nodes }}

# Dict of inventory group -> list of OS users that get a client certificate.
# Client certs are generated for all users, but only deployed on nodes that are
# a member of the corresponding group (into the user's home directory).
chainsmith_users:
  hacluster:
    - postgres
    - avchecker
    - pgquartz
    - pgfga
  router:
    - pgroute66
  backup:
    - minio

# Alternative (non-libpq) client cert locations:
# chainsmith_client_cert_sub_folder: '.chainsmith'
# chainsmith_client_cert_filename: 'client.crt'
# chainsmith_client_pkey_filename: 'client.key'

# Folder (relative to the user's home directory) where client certificates are deployed.
chainsmith_client_cert_sub_folder: ".postgresql"
# Filename of the client certificate (libpq default: postgresql.crt).
chainsmith_client_cert_filename: "postgresql.crt"
# Filename of the client private key (libpq default: postgresql.key).
chainsmith_client_pkey_filename: "postgresql.key"
# Filename of the root certificate (server chain) used by clients to verify the server.
chainsmith_client_root_filename: root.crt

# List of all users from chainsmith_users (flattened), used as client cert names.
chainsmith_internal_clients: |
  {% set clients = [] %}
  {% for groupclients in chainsmith_users.values() %}
  {% do clients.extend(groupclients) %}
  {% endfor %}
  {{ clients }}

# Additional client certificate names to generate which are not deployed by this role
# (e.g. for applications). They are available in the chainsmith output.
chainsmith_external_clients:
  - applicatie

# Definition of the intermediate CA that issues the client certificates.
chainsmith_client_intermediate:
  name: client
  clients: "{{ chainsmith_internal_clients + chainsmith_external_clients }}"
  keyUsages:
    - keyEncipherment
    - dataEncipherment
    - digitalSignature
  extendedKeyUsages:
    - clientAuth

# Full chainsmith configuration, written as JSON and passed to `chainsmith issue`.
chainsmith_body:
  subject: "{{ chainsmith_subject }}"
  tmpdir: "{{ chainsmith_tmpdir }}"
  intermediates:
    - "{{ chainsmith_server_intermediate }}"
    - "{{ chainsmith_client_intermediate }}"

# Folder where the server certificate, key and root certificate are deployed.
chainsmith_server_cert_path: "/etc/pki/{{ chainsmith_server_cert_owner }}"
# OS user owning the server certificate folder and files.
chainsmith_server_cert_owner: postgres

# Folders to create for server certificate files (list of dicts with dest and owner).
chainsmith_server_folders:
  - dest: "{{ chainsmith_server_cert_path }}"
    owner: "{{ chainsmith_server_cert_owner }}"

# Server certificate files to deploy (list of dicts with dest, owner and content).
# root.crt contains the client chain, used by the server to verify client certs.
chainsmith_server_cert_files:
  - dest: "{{ chainsmith_server_cert_path }}/server.crt"
    owner: "{{ chainsmith_server_cert_owner }}"
    content: "{{ chainsmith_results_server_cert }}"
  - dest: "{{ chainsmith_server_cert_path }}/root.crt"
    owner: "{{ chainsmith_server_cert_owner }}"
    content: "{{ chainsmith_results_client_chain }}"

# Server private key files to deploy (list of dicts with dest, owner and content).
chainsmith_server_key_files:
  - dest: "{{ chainsmith_server_cert_path }}/server.key"
    owner: "{{ chainsmith_server_cert_owner }}"
    content: "{{ chainsmith_results_server_key }}"

# List of certificate files (dicts with dest) on a node that are checked for existence
# and expiry. If any is missing or expiring, all certs are regenerated and redeployed.
chainsmith_cert_files: |
  {% set files = [] %}
  {% for user in chainsmith_users | bygroup(group_names) %}
  {% do files.append({'dest': getent_passwd[user][4] + '/' + chainsmith_client_cert_sub_folder + '/' + chainsmith_client_cert_filename}) %}
  {% do files.append({'dest': getent_passwd[user][4] + '/' + chainsmith_client_cert_sub_folder + '/' + chainsmith_client_root_filename}) %}
  {% endfor %}
  {% do files.append({'dest': chainsmith_server_cert_path + '/server.crt'}) %}
  {% do files.append({'dest': chainsmith_server_cert_path + '/root.crt'}) %}
  {{ files }}
